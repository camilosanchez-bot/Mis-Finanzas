<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Money-Flow Retirement Planner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
        h1 { font-size: 28px; font-weight: 600; margin-bottom: 2rem; color: #0b0b0b; }
        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #378ADD; color: white; }
        .btn-primary:hover { background: #2871c4; }
        .btn-secondary { background: transparent; border: 1px solid #ddd; color: #333; }
        .btn-back { background: transparent; border: 1px solid #ddd; padding: 0.5rem 1rem; margin-bottom: 1.5rem; cursor: pointer; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-weight: 600; margin-bottom: 0.5rem; font-size: 13px; }
        .form-group input { padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit; }
        .card { background: white; border: 1px solid #e0e0e0; border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; }
        .golden-card { background: linear-gradient(135deg, #D4A574 0%, #A67C52 100%); border-radius: 12px; padding: 2rem; margin-bottom: 2rem; color: white; }
        .golden-number { font-size: 48px; font-weight: 600; margin: 0; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 2rem; }
        .metric-card { background: white; padding: 1rem; border-radius: 8px; border: 1px solid #e0e0e0; }
        .metric-value { font-size: 24px; font-weight: 600; color: #0b0b0b; }
        .nav-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 2rem; }
        .btn-nav { background: #f9f9f9; border: 1px solid #ddd; color: #333; padding: 1rem; cursor: pointer; }
        .btn-nav:hover { background: #f0f0f0; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .item-box { background: #f9f9f9; padding: 1rem; border-radius: 8px; border: 1px solid #e0e0e0; }
        .item-box .value { font-size: 20px; font-weight: 600; color: #0b0b0b; }
        .item-box .accent { color: #378ADD; }
        .vortex-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
        .vortex-card { padding: 1.5rem; border-radius: 8px; color: white; }
        .vortex-emergency { background: linear-gradient(135deg, #E74C3C 0%, #C0392B 100%); }
        .vortex-oxygen { background: linear-gradient(135deg, #F39C12 0%, #D68910 100%); }
        .vortex-retirement { background: linear-gradient(135deg, #27AE60 0%, #1E8449 100%); }
        .info-box { background: #E6F1FB; border: 1px solid #85B7EB; border-radius: 8px; padding: 1rem; margin-bottom: 2rem; font-size: 13px; color: #185FA5; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 1.5rem; }
        .form-row input { padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px; }
        .list { max-height: 300px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 6px; margin-bottom: 1rem; }
        .list-item { display: flex; justify-content: space-between; padding: 0.75rem; border-bottom: 1px solid #e0e0e0; font-size: 13px; }
        .total-box { padding: 1rem; background: #E6F1FB; border-radius: 6px; text-align: center; font-size: 13px; font-weight: 600; color: #185FA5; }
        .analysis-box { background: #EAF3DE; border: 1px solid #97C459; border-radius: 12px; padding: 1.5rem; border-left: 4px solid #639922; }
        .analysis-box p { font-size: 13px; margin-bottom: 0.75rem; }
        .milestones-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
        .milestone { background: #f9f9f9; padding: 1rem; border-radius: 8px; border: 1px solid #e0e0e0; }
        .milestone .value { font-size: 18px; font-weight: 600; }
        .milestone .value.accent { color: #378ADD; }
        .milestone .value.success { color: #27AE60; }
        .button-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-toggle { padding: 0.5rem 1rem; background: transparent; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; }
        .btn-toggle.active { background: #378ADD; color: white; border-color: #378ADD; }
        @media (max-width: 768px) { .container { padding: 1rem; } .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        class MoneyFlowApp {
            constructor() {
                this.currentStep = 'setup';
                this.investmentProfile = 'moderado';
                this.monthlyContributions = [];
                this.formData = {
                    name: '',
                    monthlyExpense: 3500000,
                    yearsToRetirement: 15,
                    initialCapital: 5000000,
                    expectedReturn: 8,
                    inflation: 4,
                    currentPatrimony: 0
                };
                this.loadData();
                this.render();
            }

            loadData() {
                const saved = localStorage.getItem('moneyflow_profile');
                if (saved) {
                    this.formData = JSON.parse(saved);
                    this.currentStep = 'dashboard';
                }
            }

            saveData() {
                localStorage.setItem('moneyflow_profile', JSON.stringify(this.formData));
                this.currentStep = 'dashboard';
                this.render();
            }

            calculateGoldenNumber() {
                const m = this.formData.monthlyExpense;
                const y = this.formData.yearsToRetirement;
                const r = this.formData.expectedReturn / 100;
                const i = this.formData.inflation / 100;
                
                const monthlyRetirement = m * Math.pow(1 + i, y);
                const totalNeeded = monthlyRetirement * 12 * 30;
                const discountFactor = Math.pow(1 + r, y);
                
                return Math.round(totalNeeded / discountFactor);
            }

            calculateProjection() {
                let balance = this.formData.initialCapital + this.formData.currentPatrimony;
                const data = [];
                const mr = this.formData.expectedReturn / 100 / 12;
                const mi = this.formData.inflation / 100 / 12;
                let contrib = this.formData.monthlyExpense;
                
                for (let m = 0; m <= this.formData.yearsToRetirement * 12; m++) {
                    const y = Math.floor(m / 12);
                    if (y > 5) contrib = this.formData.monthlyExpense * Math.pow(1 + mi, m);
                    if (m % 12 === 0) data.push({ year: y, balance: Math.round(balance) });
                    balance = balance * (1 + mr) + contrib;
                }
                return data;
            }

            getInvestmentDist() {
                const dist = {
                    conservador: { paredes: 50, habitaciones: 30, terraza: 15, piscina: 5 },
                    moderado: { paredes: 35, habitaciones: 35, terraza: 25, piscina: 5 },
                    agresivo: { paredes: 20, habitaciones: 35, terraza: 35, piscina: 10 }
                };
                return dist[this.investmentProfile];
            }

            getVortexFunds() {
                const gn = this.calculateGoldenNumber();
                return {
                    imprevistos: Math.round(gn * 0.05),
                    oxigeno: Math.round(Math.max(this.formData.monthlyExpense * 3, this.formData.monthlyExpense * 6)),
                    retiro: Math.round(gn * 0.90)
                };
            }

            renderSetup() {
                return `
                    <div class="container" style="max-width: 600px;">
                        <h1>💰 Tu Plan de Retiro Money-Flow</h1>
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Tu nombre</label>
                                <input type="text" id="name" value="${this.formData.name}" placeholder="Ej: Camilo">
                            </div>
                            <div class="form-group">
                                <label>Gasto mensual (COP)</label>
                                <input type="number" id="monthly" value="${this.formData.monthlyExpense}">
                            </div>
                            <div class="form-group">
                                <label>Años para retiro</label>
                                <input type="number" id="years" value="${this.formData.yearsToRetirement}" min="1" max="50">
                            </div>
                            <div class="form-group">
                                <label>Capital invertido (COP)</label>
                                <input type="number" id="capital" value="${this.formData.initialCapital}">
                            </div>
                            <div class="form-group">
                                <label>Patrimonio a invertir (COP)</label>
                                <input type="number" id="patrimony" value="${this.formData.currentPatrimony}">
                            </div>
                            <div class="form-group">
                                <label>Rentabilidad esperada (%)</label>
                                <input type="number" id="return" value="${this.formData.expectedReturn}" min="0" max="30" step="0.5">
                            </div>
                            <div class="form-group">
                                <label>Inflación esperada (%)</label>
                                <input type="number" id="inflation" value="${this.formData.inflation}" min="0" max="15" step="0.5">
                            </div>
                            <button class="btn btn-primary" onclick="app.updateForm(); app.saveData();" style="grid-column: 1 / -1;">🚀 Comenzar Plan</button>
                        </div>
                    </div>
                `;
            }

            updateForm() {
                this.formData.name = document.getElementById('name').value;
                this.formData.monthlyExpense = parseInt(document.getElementById('monthly').value);
                this.formData.yearsToRetirement = parseInt(document.getElementById('years').value);
                this.formData.initialCapital = parseInt(document.getElementById('capital').value);
                this.formData.currentPatrimony = parseInt(document.getElementById('patrimony').value);
                this.formData.expectedReturn = parseFloat(document.getElementById('return').value);
                this.formData.inflation = parseFloat(document.getElementById('inflation').value);
            }

            renderDashboard() {
                const gn = this.calculateGoldenNumber();
                const proj = this.calculateProjection();
                const last = proj[proj.length - 1];
                
                return `
                    <div class="container">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
                            <h1>¡Hola ${this.formData.name}! 👋</h1>
                            <button class="btn btn-secondary" onclick="app.currentStep = 'setup'; app.render();">✏️ Editar</button>
                        </div>
                        <div class="golden-card">
                            <p style="font-size: 12px; opacity: 0.9; margin-bottom: 0.5rem;">TU NÚMERO DORADO 💰</p>
                            <p class="golden-number">$${(gn / 1000000).toFixed(0)}M</p>
                            <p style="font-size: 12px; opacity: 0.85; margin-top: 0.5rem;">Patrimonio necesario para vivir hasta los 85 años</p>
                        </div>
                        <div class="metrics-grid">
                            <div class="metric-card"><p style="font-size: 11px; color: #666;">📅 Años</p><p class="metric-value">${this.formData.yearsToRetirement}</p></div>
                            <div class="metric-card"><p style="font-size: 11px; color: #666;">💸 Gasto mensual</p><p class="metric-value">$${(this.formData.monthlyExpense / 1000000).toFixed(1)}M</p></div>
                            <div class="metric-card"><p style="font-size: 11px; color: #666;">📊 Capital</p><p class="metric-value">$${(this.formData.initialCapital / 1000000).toFixed(1)}M</p></div>
                            <div class="metric-card"><p style="font-size: 11px; color: #666;">📈 Rentabilidad</p><p class="metric-value">${this.formData.expectedReturn}%</p></div>
                        </div>
                        <div class="nav-buttons">
                            <button class="btn-nav" onclick="app.currentStep = 'palancas'; app.render();">📊 Las 3 Palancas</button>
                            <button class="btn-nav" onclick="app.currentStep = 'seguimiento'; app.render();">📈 Mi Seguimiento</button>
                            <button class="btn-nav" onclick="app.currentStep = 'proyecciones'; app.render();">🔮 Proyecciones</button>
                        </div>
                        <div class="card">
                            <h3 style="margin-bottom: 1rem;">📊 Proyección de Patrimonio</h3>
                            <p style="font-size: 12px; color: #666;">Año 0: $${((this.formData.initialCapital + this.formData.currentPatrimony) / 1000000).toFixed(1)}M → Año ${this.formData.yearsToRetirement}: $${(last.balance / 1000000).toFixed(1)}M</p>
                        </div>
                    </div>
                `;
            }

            renderPalancas() {
                const dist = this.getInvestmentDist();
                const vortex = this.getVortexFunds();
                
                return `
                    <div class="container">
                        <button class="btn-back" onclick="app.currentStep = 'dashboard'; app.render();">← Atrás</button>
                        <h1>Las 3 Palancas</h1>
                        
                        <div class="card">
                            <h2 style="margin-bottom: 1rem;">🎯 Palanca 1: Cómo Ordenar tu Dinero</h2>
                            <div class="grid-2">
                                <div class="item-box">
                                    <p style="font-size: 11px; color: #666; margin-bottom: 0.5rem;">Gasto mensual</p>
                                    <p class="item-box value">$${(this.formData.monthlyExpense / 1000000).toFixed(1)}M</p>
                                </div>
                                <div class="item-box">
                                    <p style="font-size: 11px; color: #666; margin-bottom: 0.5rem;">Aporte ideal</p>
                                    <p class="item-box value accent">$${(this.formData.monthlyExpense / 1000000).toFixed(1)}M</p>
                                </div>
                            </div>
                        </div>

                        <div class="card">
                            <h2 style="margin-bottom: 1rem;">🏠 Palanca 2: Rentar Mejor</h2>
                            <div style="margin-bottom: 1.5rem;">
                                <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 0.75rem;">Perfil:</label>
                                <div class="button-group">
                                    <button class="btn-toggle ${this.investmentProfile === 'conservador' ? 'active' : ''}" onclick="app.investmentProfile = 'conservador'; app.render();">conservador</button>
                                    <button class="btn-toggle ${this.investmentProfile === 'moderado' ? 'active' : ''}" onclick="app.investmentProfile = 'moderado'; app.render();">moderado</button>
                                    <button class="btn-toggle ${this.investmentProfile === 'agresivo' ? 'active' : ''}" onclick="app.investmentProfile = 'agresivo'; app.render();">agresivo</button>
                                </div>
                            </div>
                            <div class="grid-2">
                                <div style="background: linear-gradient(135deg, #B8860B 0%, #8B6914 100%); padding: 1.5rem; border-radius: 8px; color: white;">
                                    <p style="font-size: 11px; opacity: 0.9;">🧱 Paredes</p>
                                    <p style="font-size: 20px; font-weight: 600; margin: 0;">${dist.paredes}%</p>
                                </div>
                                <div style="background: linear-gradient(135deg, #4169E1 0%, #1E90FF 100%); padding: 1.5rem; border-radius: 8px; color: white;">
                                    <p style="font-size: 11px; opacity: 0.9;">🏡 Habitaciones</p>
                                    <p style="font-size: 20px; font-weight: 600; margin: 0;">${dist.habitaciones}%</p>
                                </div>
                                <div style="background: linear-gradient(135deg, #FF6347 0%, #DC143C 100%); padding: 1.5rem; border-radius: 8px; color: white;">
                                    <p style="font-size: 11px; opacity: 0.9;">🌳 Terraza</p>
                                    <p style="font-size: 20px; font-weight: 600; margin: 0;">${dist.terraza}%</p>
                                </div>
                                <div style="background: linear-gradient(135deg, #9932CC 0%, #8B008B 100%); padding: 1.5rem; border-radius: 8px; color: white;">
                                    <p style="font-size: 11px; opacity: 0.9;">💎 Piscina</p>
                                    <p style="font-size: 20px; font-weight: 600; margin: 0;">${dist.piscina}%</p>
                                </div>
                            </div>
                        </div>

                        <div class="card">
                            <h2 style="margin-bottom: 1rem;">🌀 Palanca 3: Método Vortex</h2>
                            <div class="vortex-grid">
                                <div class="vortex-card vortex-emergency">
                                    <p style="font-size: 12px; opacity: 0.9; font-weight: 500;">🚨 Imprevistos</p>
                                    <p style="font-size: 18px; font-weight: 600; margin: 0;">5%</p>
                                    <p style="font-size: 11px; opacity: 0.85; margin-top: 0.75rem;">$${(vortex.imprevistos / 1000000).toFixed(1)}M</p>
                                </div>
                                <div class="vortex-card vortex-oxygen">
                                    <p style="font-size: 12px; opacity: 0.9; font-weight: 500;">💨 Oxígeno</p>
                                    <p style="font-size: 18px; font-weight: 600; margin: 0;">10%</p>
                                    <p style="font-size: 11px; opacity: 0.85; margin-top: 0.75rem;">$${(vortex.oxigeno / 1000000).toFixed(1)}M</p>
                                </div>
                                <div class="vortex-card vortex-retirement">
                                    <p style="font-size: 12px; opacity: 0.9; font-weight: 500;">🎯 Retiro</p>
                                    <p style="font-size: 18px; font-weight: 600; margin: 0;">85%</p>
                                    <p style="font-size: 11px; opacity: 0.85; margin-top: 0.75rem;">$${(vortex.retiro / 1000000).toFixed(1)}M</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderSeguimiento() {
                let html = `
                    <div class="container">
                        <button class="btn-back" onclick="app.currentStep = 'dashboard'; app.render();">← Atrás</button>
                        <h1>📈 Mi Seguimiento</h1>
                        <div class="info-box">📊 Registra tus aportes mensuales</div>
                        <div class="card">
                            <h3>Registrar nuevo aporte</h3>
                            <div class="form-row">
                                <input type="month" id="contrib-month">
                                <input type="number" id="contrib-amount" placeholder="Monto (COP)">
                                <button class="btn btn-primary" onclick="app.addContribution();">Agregar</button>
                            </div>
                `;
                
                if (this.monthlyContributions.length > 0) {
                    html += `
                        <h4 style="font-size: 14px; font-weight: 600; margin-bottom: 1rem;">Mis Aportes</h4>
                        <div class="list">
                    `;
                    this.monthlyContributions.forEach(c => {
                        html += `<div class="list-item"><span>${c.month}</span><span style="font-weight: 600; color: #378ADD;">$${(c.amount / 1000000).toFixed(1)}M</span></div>`;
                    });
                    const total = this.monthlyContributions.reduce((a, c) => a + c.amount, 0);
                    html += `</div><div class="total-box">Total: $${(total / 1000000).toFixed(1)}M</div>`;
                }
                html += `</div></div>`;
                return html;
            }

            addContribution() {
                const month = document.getElementById('contrib-month').value;
                const amount = parseInt(document.getElementById('contrib-amount').value);
                if (month && amount > 0) {
                    this.monthlyContributions.push({ month, amount });
                    document.getElementById('contrib-amount').value = '';
                    this.render();
                }
            }

            renderProyecciones() {
                const gn = this.calculateGoldenNumber();
                const proj = this.calculateProjection();
                const first = proj[0];
                const last = proj[proj.length - 1];
                const y5 = proj[5] || proj[0];
                
                return `
                    <div class="container">
                        <button class="btn-back" onclick="app.currentStep = 'dashboard'; app.render();">← Atrás</button>
                        <h1>🔮 Proyecciones</h1>
                        <div class="card">
                            <h3>Crecimiento estimado</h3>
                            <p style="font-size: 12px; color: #666;">Año 0: $${(first.balance / 1000000).toFixed(1)}M → Año ${this.formData.yearsToRetirement}: $${(last.balance / 1000000).toFixed(1)}M</p>
                        </div>
                        <div class="card">
                            <h3>Hitos importantes</h3>
                            <div class="milestones-grid">
                                <div class="milestone"><p style="font-size: 11px; color: #666;">Capital Inicial</p><p class="milestone value">$${((this.formData.initialCapital + this.formData.currentPatrimony) / 1000000).toFixed(1)}M</p></div>
                                <div class="milestone"><p style="font-size: 11px; color: #666;">Año 5</p><p class="milestone value">$${(y5.balance / 1000000).toFixed(1)}M</p></div>
                                <div class="milestone"><p style="font-size: 11px; color: #666;">Año Final</p><p class="milestone value accent">$${(last.balance / 1000000).toFixed(1)}M</p></div>
                                <div class="milestone"><p style="font-size: 11px; color: #666;">Número Dorado</p><p class="milestone value success">$${(gn / 1000000).toFixed(1)}M</p></div>
                            </div>
                        </div>
                        <div class="analysis-box">
                            <h3 style="margin-bottom: 1rem;">✅ Tu Plan</h3>
                            <p>✓ En ${this.formData.yearsToRetimiento} años habrás acumulado $${(last.balance / 1000000).toFixed(1)}M</p>
                            <p>✓ Tu número dorado es $${(gn / 1000000).toFixed(1)}M</p>
                            <p>✓ La diferencia será tu colchón de seguridad</p>
                        </div>
                    </div>
                `;
            }

            render() {
                const app = document.getElementById('app');
                switch(this.currentStep) {
                    case 'setup': app.innerHTML = this.renderSetup(); break;
                    case 'dashboard': app.innerHTML = this.renderDashboard(); break;
                    case 'palancas': app.innerHTML = this.renderPalancas(); break;
                    case 'seguimiento': app.innerHTML = this.renderSeguimiento(); break;
                    case 'proyecciones': app.innerHTML = this.renderProyecciones(); break;
                }
            }
        }

        const app = new MoneyFlowApp();
    </script>
</body>
</html>
