<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Money-Flow // Quantum Retirement OS</title>
    <!-- Google Fonts & Chart.js CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-base: #06080d;
            --bg-surface: rgba(14, 20, 32, 0.7);
            --bg-surface-hover: rgba(20, 29, 46, 0.85);
            --bg-glass-card: rgba(15, 23, 42, 0.6);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(0, 245, 212, 0.35);
            
            --cyan-primary: #00f5d4;
            --cyan-glow: rgba(0, 245, 212, 0.35);
            --emerald: #10b981;
            --emerald-glow: rgba(16, 185, 129, 0.3);
            --amber: #ffb703;
            --amber-glow: rgba(255, 183, 3, 0.3);
            --coral: #ff4d6d;
            --coral-glow: rgba(255, 77, 109, 0.3);
            --purple: #8338ec;
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #475569;
            
            --font-ui: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'Space Grotesk', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 245, 212, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(131, 56, 236, 0.06) 0%, transparent 45%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Futuristic Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 245, 212, 0.25);
            border-radius: 99px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--cyan-primary); }

        .app-container {
            max-width: 1380px;
            margin: 0 auto;
            padding: 2.5rem 1.75rem;
        }

        /* Top HUD Header */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-subtle);
            flex-wrap: wrap;
            gap: 1.25rem;
        }

        .brand-cluster {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, rgba(0, 245, 212, 0.2), rgba(131, 56, 236, 0.2));
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 20px var(--cyan-glow);
        }

        .brand-title {
            font-family: var(--font-mono);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(120deg, #ffffff 40%, var(--cyan-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-tag {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--cyan-primary);
            font-family: var(--font-mono);
            display: block;
        }

        .user-status {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--bg-surface);
            padding: 0.5rem 1rem 0.5rem 1.2rem;
            border-radius: 100px;
            border: 1px solid var(--border-subtle);
            backdrop-filter: blur(12px);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--cyan-primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--cyan-primary);
            animation: pulse-dot 2s infinite ease-in-out;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* Buttons */
        .btn {
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .btn-primary {
            background: var(--cyan-primary);
            color: #041014;
            font-weight: 700;
            box-shadow: 0 0 20px rgba(0, 245, 212, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 245, 212, 0.6);
            background: #2bfae0;
        }

        .btn-glass {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            backdrop-filter: blur(10px);
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .btn-danger-glass {
            background: rgba(255, 77, 109, 0.1);
            color: var(--coral);
            border: 1px solid rgba(255, 77, 109, 0.25);
            padding: 0.4rem 0.8rem;
            font-size: 12px;
        }

        .btn-danger-glass:hover {
            background: rgba(255, 77, 109, 0.2);
            border-color: var(--coral);
        }

        /* Futuristic Nav Bar / Segments */
        .hud-nav {
            display: flex;
            background: rgba(15, 23, 42, 0.65);
            padding: 0.4rem;
            border-radius: 14px;
            border: 1px solid var(--border-subtle);
            gap: 0.35rem;
            margin-bottom: 2.2rem;
            backdrop-filter: blur(14px);
            overflow-x: auto;
        }

        .nav-tab {
            flex: 1;
            min-width: 130px;
            padding: 0.8rem 1.2rem;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 10px;
            color: var(--text-muted);
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            white-space: nowrap;
        }

        .nav-tab:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.03);
        }

        .nav-tab.active {
            color: var(--cyan-primary);
            background: rgba(0, 245, 212, 0.08);
            border-color: rgba(0, 245, 212, 0.3);
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.15);
        }

        /* Cards & Containers */
        .hud-card {
            background: var(--bg-glass-card);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .hud-card:hover {
            border-color: rgba(255, 255, 255, 0.14);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.75rem;
        }

        .card-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .card-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 16px;
            background: var(--cyan-primary);
            border-radius: 4px;
            box-shadow: 0 0 10px var(--cyan-primary);
        }

        /* Hero Golden Card */
        .golden-hud {
            position: relative;
            background: linear-gradient(135deg, rgba(14, 26, 43, 0.9) 0%, rgba(10, 16, 28, 0.95) 100%);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 2.75rem 2.5rem;
            margin-bottom: 2.5rem;
            overflow: hidden;
            box-shadow: 0 0 45px rgba(0, 245, 212, 0.12);
        }

        .golden-hud::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(0, 245, 212, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        .golden-label {
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--cyan-primary);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .golden-value {
            font-family: var(--font-mono);
            font-size: clamp(42px, 6vw, 68px);
            font-weight: 800;
            line-height: 1.05;
            background: linear-gradient(135deg, #ffffff 40%, var(--cyan-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 35px rgba(0, 245, 212, 0.25);
        }

        .golden-meta {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 0.85rem;
            max-width: 600px;
        }

        /* Metric Grid */
        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2.2rem;
        }

        .metric-tile {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 1.4rem 1.6rem;
            backdrop-filter: blur(12px);
            transition: all 0.25s ease;
            position: relative;
        }

        .metric-tile:hover {
            border-color: var(--border-glow);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.5);
        }

        .metric-tag {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 0.6rem;
            font-family: var(--font-mono);
        }

        .metric-num {
            font-family: var(--font-mono);
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
        }

        .metric-num.highlight {
            color: var(--cyan-primary);
            text-shadow: 0 0 20px rgba(0, 245, 212, 0.35);
        }

        /* Futuristic Glowing Progress Bars */
        .progress-group {
            margin-bottom: 1.75rem;
        }

        .progress-group:last-child {
            margin-bottom: 0;
        }

        .progress-meta {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.65rem;
        }

        .progress-name {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .progress-numbers {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text-muted);
        }

        .progress-pct {
            color: var(--cyan-primary);
            font-weight: 700;
            margin-left: 0.5rem;
        }

        .progress-track {
            height: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            border-radius: 99px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            border-radius: 99px;
            transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            box-shadow: 0 0 16px currentColor;
        }

        /* Shimmer sweep animation across bars */
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            animation: bar-shimmer 2.6s infinite ease-in-out;
        }

        @keyframes bar-shimmer {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        /* Vortex 3-Column Visual Grid */
        .vortex-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        .vortex-box {
            padding: 1.75rem;
            border-radius: 18px;
            border: 1px solid var(--border-subtle);
            background: rgba(14, 22, 36, 0.6);
            backdrop-filter: blur(12px);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .vortex-box:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .vortex-box.emergency { border-left: 4px solid var(--coral); }
        .vortex-box.oxygen { border-left: 4px solid var(--amber); }
        .vortex-box.retirement { border-left: 4px solid var(--cyan-primary); }

        .vortex-head {
            font-size: 12px;
            text-transform: uppercase;
            font-family: var(--font-mono);
            letter-spacing: 1px;
            margin-bottom: 0.75rem;
            color: var(--text-muted);
        }

        .vortex-val {
            font-family: var(--font-mono);
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }

        .vortex-sub {
            font-size: 12px;
            color: var(--text-dim);
            font-family: var(--font-mono);
        }

        /* Forms & Inputs */
        .form-grid-hud {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.75rem;
        }

        .field-box {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .field-box label {
            font-size: 11px;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .field-box input, .field-box select {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .field-box input:focus, .field-box select:focus {
            outline: none;
            border-color: var(--cyan-primary);
            background: rgba(0, 245, 212, 0.04);
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.2);
        }

        /* Investment Ledger / Table */
        .ledger-table-wrap {
            overflow-x: auto;
        }

        .ledger-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }

        .ledger-table th {
            padding: 1rem;
            font-family: var(--font-mono);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-subtle);
        }

        .ledger-table td {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--text-main);
        }

        .ledger-table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .badge-fund {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.65rem;
            border-radius: 100px;
            font-size: 11px;
            font-family: var(--font-mono);
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-fund.imprevistos {
            background: rgba(255, 77, 109, 0.15);
            color: var(--coral);
            border: 1px solid rgba(255, 77, 109, 0.3);
        }

        .badge-fund.oxigeno {
            background: rgba(255, 183, 3, 0.15);
            color: var(--amber);
            border: 1px solid rgba(255, 183, 3, 0.3);
        }

        .badge-fund.retiro {
            background: rgba(0, 245, 212, 0.15);
            color: var(--cyan-primary);
            border: 1px solid rgba(0, 245, 212, 0.3);
        }

        /* Segmented Profile Switcher */
        .profile-switch-wrap {
            display: flex;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            padding: 0.3rem;
            border-radius: 12px;
            width: fit-content;
            margin-bottom: 1.75rem;
        }

        .profile-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .profile-btn.active {
            background: var(--cyan-primary);
            color: #041014;
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.35);
        }

        /* Two-column layout helper */
        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.75rem;
        }

        @media (max-width: 992px) {
            .grid-2col { grid-template-columns: 1fr; }
        }

        @media (max-width: 640px) {
            .app-container { padding: 1.25rem 1rem; }
            .hud-header { flex-direction: column; align-items: flex-start; }
            .golden-hud { padding: 1.75rem; }
            .metric-grid { grid-template-columns: 1fr 1fr; }
            .vortex-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        class MoneyFlowApp {
            constructor() {
                this.currentStep = 'setup';
                this.investmentProfile = 'moderado';
                this.investments = [];
                this.charts = {}; // Store active Chart.js instances
                this.formData = {
                    name: '',
                    monthlyExpense: 3500000,
                    yearsToRetirement: 15,
                    initialCapital: 5000000,
                    expectedReturn: 8,
                    inflation: 4,
                    currentPatrimony: 0
                };
                this.loadData();
                this.render();
            }

            loadData() {
                const saved = localStorage.getItem('moneyflow_profile');
                const investments = localStorage.getItem('moneyflow_investments');
                if (saved) {
                    this.formData = JSON.parse(saved);
                    this.currentStep = 'dashboard';
                }
                if (investments) {
                    this.investments = JSON.parse(investments);
                }
            }

            saveData() {
                localStorage.setItem('moneyflow_profile', JSON.stringify(this.formData));
                localStorage.setItem('moneyflow_investments', JSON.stringify(this.investments));
                this.currentStep = 'dashboard';
                this.render();
            }

            formatM(num) {
                return (num / 1000000).toFixed(1) + 'M';
            }

            formatFullCOP(num) {
                return new Intl.NumberFormat('es-CO', {
                    style: 'currency',
                    currency: 'COP',
                    maximumFractionDigits: 0
                }).format(num);
            }

            calculateGoldenNumber() {
                const m = this.formData.monthlyExpense;
                const y = this.formData.yearsToRetirement;
                const r = this.formData.expectedReturn / 100;
                const i = this.formData.inflation / 100;
                const monthlyRetirement = m * Math.pow(1 + i, y);
                const totalNeeded = monthlyRetirement * 12 * 30;
                const discountFactor = Math.pow(1 + r, y);
                return Math.round(totalNeeded / discountFactor);
            }

            calculateProjection() {
                let balance = this.formData.initialCapital + this.formData.currentPatrimony;
                const data = [];
                const mr = this.formData.expectedReturn / 100 / 12;
                const mi = this.formData.inflation / 100 / 12;
                let contrib = this.formData.monthlyExpense;
                
                // Bug fix: yearsToRetirement instead of yearsToRetimiento
                for (let m = 0; m <= this.formData.yearsToRetirement * 12; m++) {
                    const y = Math.floor(m / 12);
                    if (y > 5) contrib = this.formData.monthlyExpense * Math.pow(1 + mi, m);
                    if (m % 12 === 0) data.push({ year: y, balance: Math.round(balance) });
                    balance = balance * (1 + mr) + contrib;
                }
                return data;
            }

            getVortexFunds() {
                const gn = this.calculateGoldenNumber();
                return {
                    imprevistos: Math.round(gn * 0.05),
                    oxigeno: Math.round(this.formData.monthlyExpense * 6),
                    retiro: Math.round(gn * 0.90)
                };
            }

            getInvestedAmount(fundType) {
                return this.investments
                    .filter(inv => inv.fund === fundType)
                    .reduce((sum, inv) => sum + inv.amount, 0);
            }

            getTotalInvested() {
                return this.investments.reduce((sum, inv) => sum + inv.amount, 0);
            }

            getProgressPercent(current, target) {
                if (!target || target === 0) return 0;
                const percent = (current / target) * 100;
                return Math.min(Math.round(percent), 100);
            }

            addInvestment() {
                const date = document.getElementById('inv-date').value;
                const entity = document.getElementById('inv-entity').value;
                const bank = document.getElementById('inv-bank').value;
                const fund = document.getElementById('inv-fund').value;
                const amount = parseInt(document.getElementById('inv-amount').value);
                const notes = document.getElementById('inv-notes').value;

                if (date && entity && amount > 0 && fund) {
                    this.investments.push({
                        id: Date.now(),
                        date,
                        entity,
                        bank,
                        fund,
                        amount,
                        notes
                    });
                    localStorage.setItem('moneyflow_investments', JSON.stringify(this.investments));
                    this.render();
                }
            }

            deleteInvestment(id) {
                this.investments = this.investments.filter(inv => inv.id !== id);
                localStorage.setItem('moneyflow_investments', JSON.stringify(this.investments));
                this.render();
            }

            updateForm() {
                this.formData.name = document.getElementById('name').value || 'Inversionista';
                this.formData.monthlyExpense = parseInt(document.getElementById('monthly').value) || 0;
                this.formData.yearsToRetirement = parseInt(document.getElementById('years').value) || 1;
                this.formData.initialCapital = parseInt(document.getElementById('capital').value) || 0;

            // Initializes Chart.js graphs cleanly after rendering HTML
            initCharts() {
                this.destroyCharts();

                // 1. Dashboard Donut
                const donutEl = document.getElementById('vortexDonutChart');
                if (donutEl) {
                    const ctx = donutEl.getContext('2d');
                    const vortex = this.getVortexFunds();
                    const imprev = this.getInvestedAmount('imprevistos');
                    const oxy = this.getInvestedAmount('oxigeno');
                    const retire = this.getInvestedAmount('retiro');

                    this.charts.vortexDonut = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: ['Imprevistos', 'Oxígeno', 'Retiro'],
                            datasets: [{
                                data: [imprev || 1, oxy || 1, retire || 1],
                                backgroundColor: ['#ff4d6d', '#ffb703', '#00f5d4'],
                                borderColor: '#06080d',
                                borderWidth: 3,
                                hoverOffset: 8
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: { color: '#94a3b8', font: { family: 'Space Grotesk' } }
                                }
                            },
                            cutout: '72%'
                        }
                    });
                }

                // 2. Projection Line Chart
                const projEl = document.getElementById('projectionChart');
                if (projEl) {
                    const ctx = projEl.getContext('2d');
                    const projData = this.calculateProjection();
                    const labels = projData.map(d => `Año ${d.year}`);
                    const values = projData.map(d => Math.round(d.balance / 1000000));
                    const gn = Math.round(this.calculateGoldenNumber() / 1000000);

                    // Gradient Fill for futuristic glow
                    const gradient = ctx.createLinearGradient(0, 0, 0, 350);
                    gradient.addColorStop(0, 'rgba(0, 245, 212, 0.35)');
                    gradient.addColorStop(1, 'rgba(0, 245, 212, 0.0)');

                    this.charts.projection = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [
                                {
                                    label: 'Patrimonio ($ Millones COP)',
                                    data: values,
                                    borderColor: '#00f5d4',
                                    backgroundColor: gradient,
                                    fill: true,
                                    tension: 0.35,
                                    borderWidth: 3,
                                    pointBackgroundColor: '#00f5d4',
                                    pointBorderColor: '#06080d',
                                    pointHoverRadius: 6
                                },
                                {
                                    label: 'Número Dorado Meta ($M)',
                                    data: Array(labels.length).fill(gn),
                                    borderColor: 'rgba(255, 77, 109, 0.7)',
                                    borderDash: [6, 6],
                                    borderWidth: 2,
                                    pointRadius: 0,
                                    fill: false
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    labels: { color: '#94a3b8', font: { family: 'Space Grotesk' } }
                                },
                                tooltip: {
                                    callbacks: {
                                        label: (context) => `${context.dataset.label}: $${context.parsed.y}M`
                                    }
                                }
                            },
                            scales: {
                                x: {
                                    grid: { color: 'rgba(255,255,255,0.04)' },
                                    ticks: { color: '#64748b', font: { family: 'Space Grotesk' } }
                                },
                                y: {
                                    grid: { color: 'rgba(255,255,255,0.04)' },
                                    ticks: {
                                        color: '#64748b',
                                        font: { family: 'Space Grotesk' },
                                        callback: v => '$' + v + 'M'
                                    }
                                }
                            }
                        }
                    });
                }

                // 3. House Allocation Donut
                const houseEl = document.getElementById('houseChart');
                if (houseEl) {
                    const distMap = {
                        conservador: [50, 30, 15, 5],
                        moderado: [35, 35, 25, 5],
                        agresivo: [20, 35, 35, 10]
                    };
                    const data = distMap[this.investmentProfile];
                    const ctx = houseEl.getContext('2d');

                    this.charts.house = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: ['Paredes', 'Habitaciones', 'Terraza', 'Piscina'],
                            datasets: [{
                                data: data,
                                backgroundColor: ['#3a86ff', '#00f5d4', '#ffb703', '#8338ec'],
                                borderColor: '#06080d',
                                borderWidth: 3
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: { color: '#94a3b8', font: { family: 'Space Grotesk' } }
                                }
                            },
                            cutout: '70%'
                        }
                    });
                }
            }

            render() {
                const app = document.getElementById('app');
                switch(this.currentStep) {
                    case 'setup': app.innerHTML = this.renderSetup(); break;
                    case 'dashboard': app.innerHTML = this.renderDashboard(); break;
                    case 'investments': app.innerHTML = this.renderInvestments(); break;
                    case 'proyecciones': app.innerHTML = this.renderProyecciones(); break;
                    case 'palancas': app.innerHTML = this.renderPalancas(); break;
                    default: app.innerHTML = this.renderDashboard();
                }
                // Initialize charts once DOM is injected
                this.initCharts();
            }
        }

        const app = new MoneyFlowApp();
    </script>
</body>
</html>
